name: Epic Network Diagnostics

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Probe Epic endpoints
        shell: bash
        run: |
          set -u

          probe() {
            local name="$1"
            local url="$2"
            local body="body-${name}.txt"
            local headers="headers-${name}.txt"
            local meta="meta-${name}.txt"

            echo "::group::${name}"
            echo "URL: ${url}"
            curl \
              --location \
              --max-time 30 \
              --connect-timeout 15 \
              --retry 1 \
              --retry-delay 2 \
              --silent \
              --show-error \
              --dump-header "${headers}" \
              --output "${body}" \
              --write-out 'http_code=%{http_code}\nremote_ip=%{remote_ip}\nurl_effective=%{url_effective}\ncontent_type=%{content_type}\ntime_total=%{time_total}\n' \
              "${url}" > "${meta}" || true

            cat "${meta}"
            echo "--- response headers ---"
            sed -n '1,40p' "${headers}" || true
            echo "--- body preview ---"
            LC_ALL=C tr -cd '\11\12\15\40-\176' < "${body}" | head -c 800 || true
            echo
            echo "::endgroup::"
          }

          probe "backend-free-games-json" "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=en-US&country=US&allowCountries=US"
          probe "store-free-games-page" "https://store.epicgames.com/free-games?lang=en-US"
          probe "epic-login-page" "https://www.epicgames.com/id/login?lang=en-US"
          probe "hcaptcha-siteconfig" "https://api.hcaptcha.com/checksiteconfig?host=www.epicgames.com&sitekey=91e4137f-95af-4bc9-97af-cdcedce21c8c&sc=1&swa=1&spst=0"
