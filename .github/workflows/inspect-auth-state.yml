name: Inspect cached auth state
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: app/volumes
          key: epic-state-v2-38898054285-1
          fail-on-cache-miss: true
      - run: python scripts/inspect_cached_auth.py
