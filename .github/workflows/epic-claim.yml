name: Epic Kiosk Claim

on:
  schedule:
    - cron: "55 3 * * 6"
  workflow_dispatch:
    inputs:
      account_limit:
        description: "Limit accounts for a manual debug run. Leave empty to run all."
        required: false
        default: ""
      account_index:
        description: "Run only one 1-based account index. Overrides account_limit."
        required: false
        default: ""
      execution_timeout:
        description: "hcaptcha challenge execution timeout in seconds."
        required: false
        default: "120"
      login_result_timeout:
        description: "Epic login result timeout in seconds."
        required: false
        default: "180"
      account_max_attempts:
        description: "Maximum attempts per account. Retries use a fresh browser process."
        required: false
        default: "3"

concurrency:
  group: epic-kiosk-claim
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      API_PROVIDER: openai_compatible
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_KEY: ${{ secrets.API_KEY }}
      GEMINI_API_KEY: not_used
      PRIMARY_MODEL: agnes-2.0-flash
      PRIMARY_MODEL_FALLBACK: agnes-2.0-flash
      CAPTCHA_MODEL: agnes-2.0-flash
      CAPTCHA_MODEL_FALLBACK: agnes-2.0-flash
      API_USER_AGENT: epic-kiosk-github-actions/1.0
      API_SERVICE_TIER: ""
      RESPONSE_TIMEOUT: "120"
      TASK_TIMEOUT_SECONDS: "1200"
      EXECUTION_TIMEOUT: ${{ github.event.inputs.execution_timeout || '120' }}
      LOGIN_RESULT_TIMEOUT_SECONDS: ${{ github.event.inputs.login_result_timeout || '180' }}
      CAPTCHA_FAILURE_MAX_RETRIES: "0"
      CHECKOUT_MAX_ATTEMPTS: "3"
      EPIC_ACCOUNT_MAX_ATTEMPTS: ${{ github.event.inputs.account_max_attempts || '3' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth curl ca-certificates \
            fonts-liberation \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 \
            libnspr4 libnss3 libwayland-client0 libxcomposite1 \
            libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 xdg-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            apscheduler \
            pydantic-settings \
            "celery[redis]" \
            "hcaptcha-challenger[camoufox]>=0.18.13" \
            openai \
            redis \
            requests \
            beautifulsoup4 \
            lxml \
            httpx \
            pytz \
            loguru \
            tenacity \
            pyyaml

      - name: Restore browser state
        uses: actions/cache/restore@v4
        with:
          path: app/volumes
          key: epic-state-v2-${{ github.run_id }}
          restore-keys: |
            epic-state-v2-

      - name: Run Epic claim
        env:
          EPIC_ACCOUNTS_JSON: ${{ secrets.EPIC_ACCOUNTS_JSON }}
          EPIC_ACCOUNT_INDEX: ${{ github.event.inputs.account_index || '' }}
          EPIC_ACCOUNT_LIMIT: ${{ github.event.inputs.account_limit || '' }}
        run: python scripts/github_actions_claim_once.py

      - name: Save browser state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: app/volumes
          key: epic-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic-kiosk-logs
          path: |
            app/volumes/logs
            app/volumes/runtime
          if-no-files-found: ignore
          retention-days: 14

      - name: Send ServerChan notification
        if: always()
        continue-on-error: true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_CONCLUSION: ${{ job.status }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/serverchan_notify.py
