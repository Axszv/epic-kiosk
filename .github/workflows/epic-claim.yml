name: Epic Kiosk Claim

on:
  workflow_dispatch:
  schedule:
    # 20:20 UTC = 04:20 Beijing time. Adjust if you prefer another window.
    - cron: "20 20 * * *"

concurrency:
  group: epic-kiosk-claim
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      API_PROVIDER: openai_compatible
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_KEY: ${{ secrets.API_KEY }}
      GEMINI_API_KEY: not_used
      PRIMARY_MODEL: gpt-5.4-mini
      PRIMARY_MODEL_FALLBACK: gpt-5.4
      CAPTCHA_MODEL: gpt-5.4-mini
      CAPTCHA_MODEL_FALLBACK: gpt-5.4
      RESPONSE_TIMEOUT: "120"
      TASK_TIMEOUT_SECONDS: "1200"
      CAPTCHA_FAILURE_MAX_RETRIES: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth curl ca-certificates \
            fonts-liberation \
            libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 \
            libnspr4 libnss3 libwayland-client0 libxcomposite1 \
            libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 xdg-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            apscheduler \
            pydantic-settings \
            "celery[redis]" \
            "hcaptcha-challenger[camoufox]>=0.18.13" \
            openai \
            redis \
            requests \
            beautifulsoup4 \
            lxml \
            httpx \
            pytz \
            loguru \
            tenacity \
            pyyaml

      - name: Restore browser state
        uses: actions/cache/restore@v4
        with:
          path: app/volumes
          key: epic-state-${{ github.run_id }}
          restore-keys: |
            epic-state-

      - name: Run Epic claim
        env:
          EPIC_ACCOUNTS_JSON: ${{ secrets.EPIC_ACCOUNTS_JSON }}
        run: python scripts/github_actions_claim_once.py

      - name: Save browser state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: app/volumes
          key: epic-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epic-kiosk-logs
          path: |
            app/volumes/logs
            app/volumes/runtime
          if-no-files-found: ignore
          retention-days: 14
