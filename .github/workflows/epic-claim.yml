name: Epic Kiosk Claim

on:
  workflow_dispatch:
    inputs:
      account_limit:
        description: "Limit accounts for a manual debug run. Leave empty to run all."
        required: false
        default: ""
      account_index:
        description: "Run only one 1-based account index. Overrides account_limit."
        required: false
        default: ""
      execution_timeout:
        description: "hcaptcha challenge execution timeout in seconds."
        required: false
        default: "300"
      login_result_timeout:
        description: "Epic login result timeout in seconds."
        required: false
        default: "600"
      account_max_attempts:
        description: "Maximum attempts per account. Only an explicitly invalid cookie clears its profile."
        required: false
        default: "3"
      fresh_profile:
        description: "Use a temporary uncached browser profile for a manual diagnostic run."
        required: false
        default: "false"
      browser_engine:
        description: "Browser for a manual compatibility diagnostic (camoufox or chromium)."
        required: false
        default: "camoufox"
      browser_headless:
        description: "Use headless browser mode (false uses the existing Xvfb display)."
        required: false
        default: "true"
      use_browser_proxy:
        description: "Use the EPIC_BROWSER_PROXY secret for a manual network comparison."
        required: false
        default: "false"
      proxy_check_only:
        description: "Only check the enabled proxy's connectivity and egress consistency; do not sign in."
        required: false
        default: "false"
      captcha_visual_only:
        description: "Diagnose challenges without injecting payload-decoding scripts."
        required: false
        default: "false"
      confirm_delay_ms:
        description: "Delay the first confirm-order request so the Talon hCaptcha callback can settle."
        required: false
        default: "0"
      captcha_model:
        description: "Captcha model for a manual A/B diagnostic run."
        required: false
        default: "agnes-3.0-flash"
  schedule:
    # 00:23 UTC = 08:23 Beijing time, Wednesday and Friday.
    - cron: "23 0 * * 3,5"
    # 12:23 UTC = 20:23 Beijing time, Wednesday and Friday.
    - cron: "23 12 * * 3,5"

concurrency:
  # Keep scheduled/full runs mutually exclusive, while allowing targeted
  # manual recovery runs for different accounts to execute in parallel.
  group: epic-kiosk-claim-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.account_index || 'all' }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      API_PROVIDER: openai_compatible
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_KEY: ${{ secrets.API_KEY }}
      GEMINI_API_KEY: not_used
      PRIMARY_MODEL: agnes-2.5-flash
      PRIMARY_MODEL_FALLBACK: agnes-2.5-flash
      CAPTCHA_MODEL: ${{ github.event.inputs.captcha_model || 'agnes-3.0-flash' }}
      CAPTCHA_MODEL_FALLBACK: agnes-2.5-flash
      API_USER_AGENT: epic-kiosk-github-actions/1.0
      API_SERVICE_TIER: ""
      RESPONSE_TIMEOUT: "90"
      API_MAX_RETRIES: "2"
      CAPTCHA_MAX_OUTPUT_TOKENS: "8192"
      TASK_TIMEOUT_SECONDS: "1200"
      EXECUTION_TIMEOUT: ${{ github.event.inputs.execution_timeout || '300' }}
      LOGIN_RESULT_TIMEOUT_SECONDS: ${{ github.event.inputs.login_result_timeout || '600' }}
      CAPTCHA_FAILURE_MAX_RETRIES: "0"
      CHECKOUT_MAX_ATTEMPTS: "2"
      CHECKOUT_CAPTCHA_TIMEOUT_SECONDS: "375"
      CHECKOUT_CONFIRM_DELAY_MS: ${{ github.event.inputs.confirm_delay_ms || '0' }}
      EPIC_ACCOUNT_MAX_ATTEMPTS: ${{ github.event.inputs.account_max_attempts || '3' }}
      PYTHONUNBUFFERED: "1"
      EPIC_BROWSER_ENGINE: ${{ github.event.inputs.browser_engine || 'camoufox' }}
      EPIC_BROWSER_HEADLESS: ${{ github.event.inputs.browser_headless || 'true' }}
      HCAPTCHA_VISUAL_ONLY: ${{ github.event.inputs.captcha_visual_only || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate proxy check inputs
        if: github.event.inputs.proxy_check_only == 'true'
        env:
          PROXY_ENABLED: ${{ github.event.inputs.use_browser_proxy || 'false' }}
        run: |
          if [ "$PROXY_ENABLED" != "true" ]; then
            echo "::error::proxy_check_only requires use_browser_proxy=true"
            exit 1
          fi

      - name: Install system packages
        if: github.event.inputs.proxy_check_only != 'true'
        run: |
          # GitHub-hosted Ubuntu occasionally points the runner at a stalled
          # regional mirror. Use the public archive mirror for this ephemeral job.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E 's#https?://[^[:space:]]+/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          for attempt in 1 2 3; do
            if timeout 240s sudo apt-get -o Acquire::Retries=3 update && \
              timeout 300s sudo apt-get install -y --no-install-recommends \
                xvfb xauth curl ca-certificates \
                fonts-liberation \
                libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 \
                libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 \
                libnspr4 libnss3 libwayland-client0 libxcomposite1 \
                libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 xdg-utils; then
              exit 0
            fi
            echo "apt installation attempt ${attempt} failed; retrying"
            sleep 10
          done
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: github.event.inputs.proxy_check_only != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            apscheduler \
            pydantic-settings \
            "celery[redis]" \
            "hcaptcha-challenger[camoufox]>=0.18.13" \
            "camoufox[geoip]==0.5.8" \
            "playwright==1.60.0" \
            openai \
            redis \
            requests \
            beautifulsoup4 \
            lxml \
            httpx \
            pytz \
            loguru \
            tenacity \
            pyyaml

      - name: Install Camoufox browser
        if: env.EPIC_BROWSER_ENGINE == 'camoufox' && github.event.inputs.proxy_check_only != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CAMOUFOX_UBO_DIR="${HOME}/.cache/camoufox/addons/UBO"
          if [ -d "${CAMOUFOX_UBO_DIR}" ] && [ ! -f "${CAMOUFOX_UBO_DIR}/manifest.json" ]; then
            echo "Removing incomplete Camoufox UBO addon cache"
            rm -rf "${CAMOUFOX_UBO_DIR}"
          fi
          python scripts/install_camoufox_browser.py
          if [ ! -f "${CAMOUFOX_UBO_DIR}/manifest.json" ]; then
            echo "Camoufox UBO addon is incomplete after fetch; retrying cleanly"
            rm -rf "${CAMOUFOX_UBO_DIR}"
            python scripts/install_camoufox_browser.py
          fi
          test -f "${CAMOUFOX_UBO_DIR}/manifest.json"

      - name: Install Chromium browser
        if: env.EPIC_BROWSER_ENGINE == 'chromium' && github.event.inputs.proxy_check_only != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Restore browser state
        if: github.event.inputs.proxy_check_only != 'true'
        uses: actions/cache/restore@v4
        with:
          path: app/volumes
          key: epic-state-v2-${{ github.run_id }}
          restore-keys: |
            epic-state-v2-

      - name: Prepare browser proxy
        if: github.event.inputs.use_browser_proxy == 'true'
        env:
          EPIC_BROWSER_PROXY: ${{ secrets.EPIC_BROWSER_PROXY }}
          EPIC_PROXY_EGRESS_CHECK: ${{ github.event.inputs.proxy_check_only || 'false' }}
        run: python scripts/prepare_browser_proxy.py

      - name: Run Epic claim
        if: github.event.inputs.proxy_check_only != 'true'
        env:
          EPIC_USE_BROWSER_PROXY: ${{ github.event.inputs.use_browser_proxy || 'false' }}
          EPIC_ACCOUNTS_JSON: ${{ secrets.EPIC_ACCOUNTS_JSON }}
          EPIC_ACCOUNT_INDEX: ${{ github.event.inputs.account_index || '' }}
          EPIC_ACCOUNT_LIMIT: ${{ github.event.inputs.account_limit || '' }}
          EPIC_FRESH_PROFILE: ${{ github.event.inputs.fresh_profile || 'false' }}
        run: |
          if [ "$EPIC_USE_BROWSER_PROXY" = "true" ] && [ -z "$EPIC_BROWSER_PROXY" ]; then
            echo "::error::EPIC_BROWSER_PROXY secret is required for this network comparison"
            exit 1
          fi
          python scripts/github_actions_claim_once.py

      - name: Stop browser proxy
        if: always()
        run: |
          if [[ "${EPIC_BROWSER_PROXY_PID:-}" =~ ^[0-9]+$ ]]; then
            kill "$EPIC_BROWSER_PROXY_PID" 2>/dev/null || true
          fi

      - name: Save browser state
        if: always() && github.event.inputs.proxy_check_only != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/volumes
          key: epic-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload logs
        if: always() && github.event.inputs.proxy_check_only != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: epic-kiosk-logs
          path: |
            app/volumes/logs
            app/volumes/runtime/*.json
            app/volumes/runtime/*.html
            app/volumes/runtime/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Send ServerChan notification
        if: always() && github.event.inputs.proxy_check_only != 'true'
        continue-on-error: true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_CONCLUSION: ${{ job.status }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/serverchan_notify.py
