name: Epic Kiosk Claim

on:
  workflow_dispatch:
    inputs:
      account_limit:
        description: "Limit accounts for a manual debug run. Leave empty to run all."
        required: false
        default: ""
      account_index:
        description: "Run only one 1-based account index. Overrides account_limit."
        required: false
        default: ""
      execution_timeout:
        description: "hcaptcha challenge execution timeout in seconds."
        required: false
        default: "300"
      login_result_timeout:
        description: "Epic login result timeout in seconds."
        required: false
        default: "600"
      account_max_attempts:
        description: "Maximum attempts per account. Only an explicitly invalid cookie clears its profile."
        required: false
        default: "3"
      fresh_profile:
        description: "Use a temporary uncached browser profile for a manual diagnostic run."
        required: false
        default: "false"
      use_browser_proxy:
        description: "Use the EPIC_BROWSER_PROXY secret for a manual network comparison."
        required: false
        default: "false"
      proxy_check_only:
        description: "Only check the enabled proxy's connectivity and egress consistency; do not sign in."
        required: false
        default: "false"
      worker_proxyip:
        description: "Optional public IP to pin the edgetunnel Worker's reverse-proxy target for this run."
        required: false
        default: ""
      confirm_delay_ms:
        description: "Delay the first confirm-order request so the Talon hCaptcha callback can settle."
        required: false
        default: "0"
      browser_headless:
        description: "Run the browser headless. The Xvfb display is used otherwise."
        required: false
        default: "false"
      let_page_solve_captcha:
        description: "Let the page answer Epic's invisible hCaptcha on its own."
        required: false
        default: "false"
      live_xsrf_route:
        description: "Send Epic's live XSRF cookie with the login transaction and drop the portal's replay."
        required: false
        default: "true"
      captcha_model:
        description: "Captcha model for a manual A/B diagnostic run."
        required: false
        default: ""
      restore_state_key:
        description: "Restore this exact browser-state cache instead of the newest one."
        required: false
        default: ""
      skip_mobile:
        description: "Leave the mobile channel out; it opens its own login pages."
        required: false
        default: "false"
      seed_sessions:
        description: "Session seed mode: auto (empty profiles only), always or off."
        required: false
        default: "auto"
      reset_login_cookies:
        description: "Clear the Epic cookies of the profile before the login form starts."
        required: false
        default: "true"
      api_provider:
        description: "openai_compatible, or gemini to use the library's own provider."
        required: false
        default: "openai_compatible"
      list_models:
        description: "Only list the models the gateway serves, then stop."
        required: false
        default: "false"
  schedule:
    # 00:23 UTC = 08:23 Beijing time, Wednesday and Friday.
    - cron: "23 0 * * 3,5"
    # 12:23 UTC = 20:23 Beijing time, Wednesday and Friday.
    - cron: "23 12 * * 3,5"

concurrency:
  # Keep scheduled/full runs mutually exclusive, while allowing targeted
  # manual recovery runs for different accounts to execute in parallel.
  group: epic-kiosk-claim-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.account_index || 'all' }}
  cancel-in-progress: false

jobs:
  models:
    if: github.event.inputs.list_models == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: ${{ secrets.CAPTCHA_API_BASE_URL || secrets.API_BASE_URL }}
      API_KEY: ${{ secrets.CAPTCHA_API_KEY || secrets.API_KEY }}
      API_VERSION: ${{ vars.API_VERSION || 'v1' }}
    steps:
      - name: List the models the gateway serves
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = (os.environ.get("API_BASE_URL") or "").rstrip("/")
          key = os.environ.get("API_KEY") or ""
          if not base or not key:
              raise SystemExit("API_BASE_URL / API_KEY are not configured")

          # The gateway exposes no model list: `/models` answers 404 and the
          # native root answers 401. A one-token completion per candidate is
          # the only honest test of whether a name exists.
          CANDIDATES = [
              "gemini-3.5-flash-lite",
              "gemini-3.5-flash",
              "gemini-3-flash",
              "gemini-3-pro",
              "gemini-2.5-flash",
              "gemini-2.5-pro",
              "gemini-2.0-flash",
              "agnes-2.5-flash",
              "agnes-3.0-flash",
              "agnes-3.5-flash",
          ]

          version = (os.environ.get("API_VERSION") or "").strip("/")

          def endpoint(root: str, path: str) -> str:
              return root + (f"/{version}" if version else "") + path

          def probe(url: str, model: str):
              body = json.dumps(
                  {
                      "model": model,
                      "messages": [{"role": "user", "content": "hi"}],
                      "max_tokens": 1,
                  }
              ).encode("utf-8")
              request = urllib.request.Request(
                  url,
                  data=body,
                  headers={
                      "Authorization": f"Bearer {key}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      payload = json.loads(
                          response.read().decode("utf-8", "replace")
                      )
                      # A gateway may answer 200 for a name it does not serve
                      # and quietly route the request to its default. The
                      # `model` field is what actually answered.
                      answered = str(payload.get("model") or "")
                      content = ""
                      try:
                          content = (
                              payload["choices"][0]["message"]["content"] or ""
                          )
                      except Exception:  # noqa: BLE001
                          pass
                      verdict = (
                          "OK   "
                          if answered == model
                          else "ALIAS"
                      )
                      return (
                          f"{verdict} {model}  (HTTP {response.status}, "
                          f"answered={answered!r}, "
                          f"content={' '.join(content.split())[:40]!r})"
                      )
              except urllib.error.HTTPError as err:
                  detail = err.read().decode("utf-8", "replace")
                  return f"HTTP {err.code}  {model}  {detail[:120]}"
              except Exception as err:  # noqa: BLE001
                  return f"FAIL  {model}  {type(err).__name__}: {err}"

          # The control decides which endpoint is the real one: a path that
          # cannot answer for a model known to work cannot answer for any.
          control = "gemini-3.5-flash-lite"
          chosen = None
          for root in (base, base[: -len(version)] if version and base.endswith(version) else base):
              for path in ("/chat/completions", "/v1beta/openai/chat/completions"):
                  url = endpoint(root, path)
                  verdict = probe(url, control)
                  print(f"CONTROL {verdict}  {url}")
                  if verdict.startswith("OK"):
                      chosen = (root, path)
                      break
              if chosen:
                  break
          if not chosen:
              raise SystemExit("no endpoint answered for the control model")

          root, path = chosen
          print(f"USING {endpoint(root, path)}")
          for model in CANDIDATES:
              print(probe(endpoint(root, path), model))
          PY

  claim:
    if: github.event.inputs.list_models != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # The accounts run one after another in this job, the way the claim
    # succeeded on 2026-10-14. They share one model gateway key, and the
    # free tier of that gateway takes only a few requests a minute, so
    # accounts that run at the same time answer their captchas into a rate
    # limit that leaves a week with a single chance.

    env:
      API_PROVIDER: ${{ github.event.inputs.api_provider || 'openai_compatible' }}
      # Base URL, key, API version and model belong to one provider and are
      # chosen together by the first step. Agnes serves `agnes-3.0-flash` at
      # `https://apihub.agnes-ai.com/v1` (OpenAI-compatible, `Bearer`); the
      # Gemini-compatible gateway serves `gemini-3.5-flash-lite` under
      # `v1beta/openai`. Taking the base from one and the version from the
      # other is what asked for `POST /v1/v1beta/openai/chat/completions` and
      # got 404.
      CAPTCHA_PROVIDER: ${{ vars.CAPTCHA_PROVIDER || 'gemini' }}
      API_SEND_THINKING_KWARG: ${{ vars.API_SEND_THINKING_KWARG || 'true' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'not_used' }}
      PRIMARY_MODEL: agnes-2.5-flash
      PRIMARY_MODEL_FALLBACK: agnes-2.5-flash
      API_USER_AGENT: epic-kiosk-github-actions/1.0
      API_SERVICE_TIER: ""
      RESPONSE_TIMEOUT: "90"
      API_MAX_RETRIES: ${{ vars.API_MAX_RETRIES || 6 }}
      API_RETRY_BACKOFF_MAX: ${{ vars.API_RETRY_BACKOFF_MAX || 20 }}
      CAPTCHA_MAX_OUTPUT_TOKENS: "8192"
      TASK_TIMEOUT_SECONDS: "1500"
      EXECUTION_TIMEOUT: ${{ github.event.inputs.execution_timeout || '300' }}
      LOGIN_RESULT_TIMEOUT_SECONDS: ${{ github.event.inputs.login_result_timeout || '600' }}
      CAPTCHA_FAILURE_MAX_RETRIES: "0"
      CHECKOUT_MAX_ATTEMPTS: "3"
      CHECKOUT_CAPTCHA_TIMEOUT_SECONDS: "375"
      CHECKOUT_CONFIRM_DELAY_MS: ${{ github.event.inputs.confirm_delay_ms || '0' }}
      EPIC_ACCOUNT_MAX_ATTEMPTS: ${{ github.event.inputs.account_max_attempts || '3' }}
      # The job is cancelled at 330 minutes, and a cancelled job does not save
      # the browser state the next run starts from. Stop starting attempts
      # before that.
      EPIC_RUN_DEADLINE_MINUTES: "280"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          # GitHub-hosted Ubuntu occasionally points the runner at a stalled
          # regional mirror. Use the public archive mirror for this ephemeral job.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E 's#https?://[^[:space:]]+/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          for attempt in 1 2 3; do
            if timeout 240s sudo apt-get -o Acquire::Retries=3 update && \
              timeout 300s sudo apt-get install -y --no-install-recommends \
                xvfb xauth curl ca-certificates \
                fonts-liberation \
                libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 \
                libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 \
                libnspr4 libnss3 libwayland-client0 libxcomposite1 \
                libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 xdg-utils; then
              exit 0
            fi
            echo "apt installation attempt ${attempt} failed; retrying"
            sleep 10
          done
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            apscheduler \
            pydantic-settings \
            "celery[redis]" \
            "hcaptcha-challenger[camoufox]>=0.18.13" \
            "camoufox==0.4.11" \
            "playwright==1.60.0" \
            openai \
            redis \
            requests \
            beautifulsoup4 \
            lxml \
            httpx \
            pytz \
            loguru \
            tenacity \
            pyyaml

      - name: Select the captcha provider
        env:
          PROVIDER: ${{ vars.CAPTCHA_PROVIDER || 'gemini' }}
          INPUT_MODEL: ${{ github.event.inputs.captcha_model }}
          AGNES_BASE: ${{ secrets.API_BASE_URL }}
          AGNES_KEY: ${{ secrets.API_KEY }}
          GEMINI_BASE: ${{ secrets.CAPTCHA_API_BASE_URL }}
          GEMINI_KEY: ${{ secrets.CAPTCHA_API_KEY }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            agnes)
              base="$AGNES_BASE"; key="$AGNES_KEY"; version="v1"
              model="agnes-3.0-flash"; fallback="agnes-2.5-flash"
              ;;
            gemini)
              base="$GEMINI_BASE"; key="$GEMINI_KEY"; version="v1beta/openai"
              model="gemini-3.5-flash-lite"; fallback="gemini-3.5-flash-lite"
              ;;
            *)
              echo "::error::Unknown CAPTCHA_PROVIDER '$PROVIDER'"
              exit 1
              ;;
          esac
          if [ -z "$base" ] || [ -z "$key" ]; then
            echo "::error::CAPTCHA_PROVIDER=$PROVIDER has no base URL or key"
            exit 1
          fi
          if [ -n "${INPUT_MODEL:-}" ]; then
            model="$INPUT_MODEL"
          fi
          {
            echo "API_BASE_URL=$base"
            echo "API_KEY=$key"
            echo "API_VERSION=$version"
            echo "CAPTCHA_MODEL=$model"
            echo "CAPTCHA_MODEL_FALLBACK=$fallback"
          } >> "$GITHUB_ENV"
          echo "captcha provider: $PROVIDER | API_VERSION=$version | model=$model"

      - name: Install Camoufox browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CAMOUFOX_UBO_DIR="${HOME}/.cache/camoufox/addons/UBO"
          if [ -d "${CAMOUFOX_UBO_DIR}" ] && [ ! -f "${CAMOUFOX_UBO_DIR}/manifest.json" ]; then
            echo "Removing incomplete Camoufox UBO addon cache"
            rm -rf "${CAMOUFOX_UBO_DIR}"
          fi
          python scripts/install_camoufox_browser.py
          if [ ! -f "${CAMOUFOX_UBO_DIR}/manifest.json" ]; then
            echo "Camoufox UBO addon is incomplete after fetch; retrying cleanly"
            rm -rf "${CAMOUFOX_UBO_DIR}"
            python scripts/install_camoufox_browser.py
          fi
          test -f "${CAMOUFOX_UBO_DIR}/manifest.json"

      - name: Restore browser state
        uses: actions/cache/restore@v4
        with:
          path: app/volumes
          # A manual run can ask for one exact cache. The profiles in it are
          # the sessions of the accounts, so an older cache is the only copy
          # of a session that a later run replaced.
          key: ${{ github.event.inputs.restore_state_key || format('epic-state-v2-{0}', github.run_id) }}
          restore-keys: |
            epic-state-v2-

      - name: Prepare browser proxy
        if: >-
          (github.event.inputs.use_browser_proxy == 'true')
        # A proxy outage must not skip the weekly claim. The claim then runs
        # with the runner's direct connection instead.
        continue-on-error: true
        env:
          EPIC_BROWSER_PROXY: ${{ secrets.EPIC_BROWSER_PROXY }}
          EPIC_PROXY_EGRESS_CHECK: ${{ github.event.inputs.proxy_check_only || 'false' }}
          EPIC_WORKER_PROXYIP: ${{ github.event.inputs.worker_proxyip || '' }}
        run: python scripts/prepare_browser_proxy.py

      - name: Run Epic claim
        env:
          EPIC_USE_BROWSER_PROXY: ${{ github.event.inputs.use_browser_proxy || 'false' }}
          EPIC_LET_PAGE_SOLVE_CAPTCHA: ${{ github.event.inputs.let_page_solve_captcha || 'false' }}
          EPIC_LIVE_XSRF_ROUTE: ${{ github.event.inputs.live_xsrf_route || 'true' }}
          EPIC_BROWSER_HEADLESS: ${{ github.event.inputs.browser_headless || 'false' }}
          EPIC_ACCOUNTS_JSON: ${{ secrets.EPIC_ACCOUNTS_JSON }}
          EPIC_ACCOUNT_INDEX: ${{ github.event.inputs.account_index || '' }}
          EPIC_ACCOUNT_LIMIT: ${{ github.event.inputs.account_limit || '' }}
          EPIC_FRESH_PROFILE: ${{ github.event.inputs.fresh_profile || 'false' }}
          EPIC_SKIP_MOBILE: ${{ github.event.inputs.skip_mobile || 'false' }}
          EPIC_SESSIONS_JSON: ${{ secrets.EPIC_SESSIONS_JSON }}
          EPIC_SEED_SESSIONS: ${{ github.event.inputs.seed_sessions || 'auto' }}
          EPIC_RESET_LOGIN_COOKIES: ${{ github.event.inputs.reset_login_cookies || 'true' }}
        run: |
          if [ "$EPIC_USE_BROWSER_PROXY" = "true" ] && [ -z "$EPIC_BROWSER_PROXY" ]; then
            echo "::warning::No browser proxy is available; continuing with the runner's direct connection"
          fi
          python scripts/github_actions_claim_once.py

      - name: Stop browser proxy
        if: always()
        run: |
          if [[ "${EPIC_BROWSER_PROXY_PID:-}" =~ ^[0-9]+$ ]]; then
            kill "$EPIC_BROWSER_PROXY_PID" 2>/dev/null || true
          fi

      - name: Save browser state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: app/volumes
          key: epic-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: epic-kiosk-logs
          path: |
            app/volumes/logs
            app/volumes/runtime/*.json
            app/volumes/runtime/*.html
            app/volumes/runtime/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Send ServerChan notification
        if: always()
        continue-on-error: true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_CONCLUSION: ${{ job.status }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/serverchan_notify.py
